<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ABSENSI ONLINE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Library QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Library html2canvas untuk Download ID Card -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --primary: #0f172a;
      --primary-accent: #1e293b;
      --accent-blue: #0284c7;
      --accent-hover: #0369a1;
      --bg-body: #090d16;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    .teks-merah {
      color: #ef4444;
      font-weight: 700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      background-image: 
        radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.4) 0px, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      height: 100vh;
      color: var(--text-main);
      padding: 10px;
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      max-height: 98vh;
      padding: 16px 18px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .brand-header h2 {
      color: var(--primary);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-header p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 9px 12px;
      background-color: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-main);
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    input:focus {
      outline: none;
      background-color: #fff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.25);
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      background-color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* ID CARD STYLE DESAIN */
    .id-card-wrapper {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      margin-bottom: 10px;
      position: relative;
    }

    .id-card-header {
      background: #0b192c;
      color: #fff;
      padding: 10px 12px 14px 12px;
      text-align: center;
      position: relative;
    }

    .id-company-name {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding-right: 60px;
    }

    .id-company-address {
      font-size: 8px;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 2px;
      padding-right: 60px;
    }

    /* BARIS ATAS ID CARD: FOTO + NAMA & JABATAN */
    .id-card-top-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px 6px 14px;
    }

    /* KONTAINER FOTO LEBIH BESAR */
    .id-avatar-container {
      width: 90px;
      height: 105px;
      flex-shrink: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
    }

    /* FOTO DIPERBESAR, DI-ZOOM KE WAJAH, DAN HILANGKAN BACKGROUND */
    .id-avatar {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      border: none;
      background: transparent;
      object-fit: cover;
      object-position: center 20%; /* Fokus pada wajah */
      transform: scale(1.35);      /* Zoom agar objek manusia lebih mendominasi */
      mix-blend-mode: multiply;    /* Menghilangkan background latar foto */
      filter: contrast(110%) brightness(102%);
    }

    .id-emp-header-text {
      text-align: left;
      flex: 1;
    }

    .id-emp-name {
      font-size: 14px;
      font-weight: 800;
      color: #0b192c;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .id-emp-role {
      font-size: 10.5px;
      color: #64748b;
      font-weight: 700;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .id-card-body {
      padding: 4px 14px 10px 14px;
    }

    .id-info-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 6px;
      margin-top: 4px;
    }

    .id-details-table {
      flex: 1;
      font-size: 9.5px;
      color: #1e293b;
      text-align: left;
    }

    .id-details-table td {
      padding: 2px 0;
    }

    .id-details-table td.label {
      font-weight: 700;
      color: #475569;
      width: 45px;
    }

    .id-details-table td.separator {
      width: 10px;
      text-align: center;
    }

    .id-qrcode-wrapper {
      width: 44px;
      height: 44px;
      background: #ffffff;
      padding: 2px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .id-qrcode-wrapper img {
      width: 100% !important;
      height: 100% !important;
    }

    .id-card-footer {
      background: #0b192c;
      padding: 6px;
      text-align: center;
    }

    /* TOMBOL KELUAR & DOWNLOAD */
    .btn-logout-small {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      position: absolute;
      top: 6px;
      right: 8px;
      z-index: 5;
    }

    .btn-download-small {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(2, 132, 199, 0.4);
      color: #38bdf8;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      position: absolute;
      top: 26px;
      right: 8px;
      z-index: 5;
    }

    .camera-box {
      position: relative;
      width: 100%;
      height: 160px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 2px solid var(--border-color);
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .face-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 130px;
      border: 2px dashed rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.65);
      pointer-events: none;
    }

    .status-badge {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
      display: none;
      line-height: 1.3;
    }

    .status-badge.error { background-color: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .status-badge.success { background-color: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; }
    .status-badge.info { background-color: #eff6ff; color: var(--accent-blue); border: 1px solid #bfdbfe; }

    .result-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .result-card img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
      border: 2.5px solid var(--accent-blue);
      margin-bottom: 6px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 10.5px;
    }

    .result-row:last-child { border-bottom: none; }
    .result-row span.label { color: var(--text-muted); }
    .result-row span.val { font-weight: 600; text-align: right; }

    .tag-late { color: var(--danger); font-weight: 700; }
    .tag-ontime { color: var(--success); font-weight: 700; }
    .hidden { display: none !important; }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-secondary-group {
      display: flex;
      gap: 8px;
    }

    .btn-record {
      background-color: var(--accent-blue);
    }

    .btn-log {
      background-color: var(--primary-accent);
      flex: 1;
    }

    .btn-leave {
      background-color: var(--warning);
      flex: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <div class="brand-header">
      <h2>ABSENSI ONLINE</h2>
      <p id="portalSubText"><span class="teks-merah">INVESTAMA KALIMANTAN ENERGI GROUP</span></p>
    </div>

    <div id="statusMessage" class="status-badge"></div>

    <!-- 1. SEKSI LOGIN -->

        <input type="text" id="loginUsername" placeholder="Contoh: SUPRANOTO" required>

      <div class="form-group">

        <input type="tel" id="loginPhone" placeholder="Contoh: 08114558778" required>
      </div>
      <button class="btn" onclick="handleLogin()">Login Portal</button>
    </div>

    <!-- 2. SEKSI ABSENSI MASUK/KELUAR -->
    <div id="attendanceSection" class="hidden">
      <!-- MODEL ID CARD -->
      <div class="id-card-wrapper" id="idCardWrapper">
        <button class="btn-logout-small" data-html2canvas-ignore="true" onclick="logout()">Keluar</button>
        <button class="btn-download-small" data-html2canvas-ignore="true" onclick="downloadIDCard()">Download</button>
        
        <div class="id-card-header">
          <div class="id-company-name" id="cardCompany">
            <span>PT. KHATULISTIWA SINAR ENERGI</span>
          </div>
          <div class="id-company-address">Jln. Ahmad Wongso RT 18 Pangkalan Bun</div>
        </div>

        <div class="id-card-top-row">
          <div class="id-avatar-container">
            <img id="cardAvatar" class="id-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230b192c'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Foto Profile">
          </div>
          <div class="id-emp-header-text">
            <div class="id-emp-name" id="cardName">-</div>
            <div class="id-emp-role" id="cardPosition">-</div>
          </div>
        </div>

        <div class="id-card-body">
          <div class="id-info-container">
            <table class="id-details-table">
              <tr>
                <td class="label">ID</td>
                <td class="separator">:</td>
                <td id="cardEmpId">-</td>
              </tr>
              <tr>
                <td class="label">PHONE</td>
                <td class="separator">:</td>
                <td id="cardPhone">-</td>
              </tr>
            </table>
            <div id="cardQrCode" class="id-qrcode-wrapper"></div>
          </div>
        </div>

        <div class="id-card-footer"></div>
      </div>

      <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" class="hidden"></canvas>
        <div class="face-overlay"></div>
      </div>

      <div class="action-group">
        <button id="scanBtn" class="btn btn-record" onclick="processAttendance()">Record</button>
        <div class="btn-secondary-group">
          <a href="record.html" class="btn btn-log">Record Log</a>
          <button class="btn btn-leave" onclick="handleLeavePermission()">Izin </button>
        </div>
      </div>
    </div>

    <!-- 3. SEKSI HASIL PRESENSI -->
    <div id="resultSection" class="hidden">
      <div class="result-card">
        <img id="capturedImage" src="" alt="Foto Absen">
        <div class="result-detail">
          <div class="result-row">
            <span class="label">Perusahaan</span>
            <span class="val" id="resCompany"></span>
          </div>
          <div class="result-row">
            <span class="label">Nama Lengkap</span>
            <span class="val" id="resName"></span>
          </div>
          <div class="result-row">
            <span class="label">Jabatan</span>
            <span class="val" id="resPosition"></span>
          </div>
          <div class="result-row">
            <span class="label">Lokasi Absen</span>
            <span class="val" id="resLocation"></span>
          </div>
          <div class="result-row">
            <span class="label">Waktu Masuk</span>
            <span class="val" id="resTime"></span>
          </div>
          <div class="result-row">
            <span class="label">Status Kehadiran</span>
            <span class="val" id="resStatus"></span>
          </div>
        </div>
      </div>
      <button class="btn" style="margin-top: 8px;" onclick="location.reload()">Home</button>
    </div>
  </div>
</div>

<script>
  const SB_URL = "https://qnamtickoteyvydayyor.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuYW10aWNrb3RleXZ5ZGF5eW9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4OTU2MzksImV4cCI6MjA5MzQ3MTYzOX0.VAeN0JVnz4WNPzY5NTGmtGeHD-Da_qkCvy84ZDYZNHo";
  const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

  const ALLOWED_EMPLOYEES = [
    { empId: "IKAEN-001-B50", name: "YAYUK WIJAYANTI", phone: "085252761578", position: "HEAD MARKETING", pt: "PT. INVESTAMA KALIMANTAN ENERGI" },
    { empId: "IKAEN-002-B50", name: "ELA YULIANA", phone: "08115273322", position: "MARKETING", pt: "PT. INVESTAMA KALIMANTAN ENERGI" },
    { empId: "IKAEN-003-B50", name: "AGUS WANTO", phone: "081228008887", position: "DRIVER", pt: "PT. INVESTAMA KALIMANTAN ENERGI" },
    { empId: "IKAEN-004-B50", name: "NUR KHOLIS", phone: "082151512123", position: "DRIVER", pt: "PT. INVESTAMA KALIMANTAN ENERGI" },
    { empId: "IKAEN-005-B50", name: "MUHAMMAD MISNAN", phone: "082100001111", position: "DRIVER", pt: "PT. INVESTAMA KALIMANTAN ENERGI" },
    { empId: "IKAEN-006-B50", name: "MAHPUL", phone: "089523413899", position: "ASST.OPERASIONAL", pt: "PT. INVESTAMA KALIMANTAN ENERGI" },
    { empId: "IDE-001-B50", name: "NURHAMIDA", phone: "085225862649", position: "OPERASIONAL", pt: "PT. INDO DHARMA ENERGI" },
    { empId: "IDE-002-B50", name: "ANDI KUSHENDRAWAN", phone: "082252359023", position: "ADM AND TAX", pt: "PT. INDO DHARMA ENERGI" },
    { empId: "IDE-003-B50", name: "MISRO", phone: "085246198180", position: "ADMINISTRASI", pt: "PT. INDO DHARMA ENERGI" },
    { empId: "IDE-004-B50", name: "ALFIN", phone: "082253835106", position: "DRIVER", pt: "PT. INDO DHARMA ENERGI" },
    { empId: "IDE-005-B50", name: "SUPRIYADI", phone: "082330138377", position: "DRIVER", pt: "PT. INDO DHARMA ENERGI" },
    { empId: "KSE-001-B50", name: "SUPRANOTO", phone: "08114558778", position: "MARKETING", pt: "PT. KHATULISTIWA SINAR ENERGI" },
    { empId: "KSE-002-B50", name: "ZULFA NORMALIKA", phone: "082151841945", position: "ADMINISTRASI", pt: "PT. KHATULISTIWA SINAR ENERGI" },
    { empId: "KSE-003-B50", name: "KOMARUDIN", phone: "082254033320", position: "OPERASIONAL", pt: "PT. KHATULISTIWA SINAR ENERGI" },
    { empId: "KSE-004-B50", name: "AGUS MULYANTO", phone: "081255852929", position: "DRIVER", pt: "PT. KHATULISTIWA SINAR ENERGI" }
  ];

  const START_HOUR = 6;
  const END_HOUR = 23;
  const LATE_HOUR = 9;
  const LATE_MINUTE = 30;

  const ALLOWED_LOCATIONS = [
    { name: "Kantor ikaen", lat: -2.70671004259296 , lon: 111.637739490514 },
    { name: "Workshop ikaen", lat: -2.713916, lon: 111.640348 }
  ];
  
  const MAX_RADIUS_METERS = 100;

  let currentUserData = null;
  let currentLat = null;
  let currentLon = null;
  let matchedLocationName = "";
  let activeStream = null;

  window.onload = function() {
    const savedUser = localStorage.getItem('corporate_user_session');
    if (savedUser) {
      currentUserData = JSON.parse(savedUser);
      initAttendanceFlow();
    }
  };

  function handleLogin() {
    const nameInput = document.getElementById('loginUsername').value.trim();
    const phoneInput = document.getElementById('loginPhone').value.trim();

    if (!nameInput || !phoneInput) {
      showStatus('Harap masukkan Nama Lengkap dan Nomor HP.', 'error');
      return;
    }

    const foundEmployee = ALLOWED_EMPLOYEES.find(emp => 
      emp.name.toLowerCase() === nameInput.toLowerCase() && emp.phone === phoneInput
    );

    if (!foundEmployee) {
      showStatus('Akses Ditolak: Karyawan tidak terdaftar.', 'error');
      return;
    }

    currentUserData = foundEmployee;
    localStorage.setItem('corporate_user_session', JSON.stringify(currentUserData));
    initAttendanceFlow();
  }

  async function checkTodayAttendanceFromSupabase(phone) {
    try {
      const todayDate = new Date().toISOString().split('T')[0];
      
      const { data, error } = await supabaseClient
        .from('attendances')
        .select('created_at')
        .eq('phone', phone)
        .gte('created_at', `${todayDate}T00:00:00.000Z`)
        .lte('created_at', `${todayDate}T23:59:59.999Z`);

      if (error) throw error;

      return data && data.length > 0;
    } catch (err) {
      console.warn("Pengecekan DB gagal, menggunakan fallback sistem:", err.message);
      const lastAbsenceDate = localStorage.getItem(`absent_date_${phone}`);
      return lastAbsenceDate === new Date().toISOString().split('T')[0];
    }
  }

  function generateEmployeeQRCode(empData) {
    const qrContainer = document.getElementById('cardQrCode');
    qrContainer.innerHTML = ''; 

    const qrData = JSON.stringify({
      id: empData.empId,
      name: empData.name,
      phone: empData.phone,
      company: empData.pt || empData.company
    });

    new QRCode(qrContainer, {
      text: qrData,
      width: 40,
      height: 40,
      colorDark : "#0b192c",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.L
    });
  }

  function downloadIDCard() {
    const cardElem = document.getElementById('idCardWrapper');
    showStatus('Membuat gambar ID Card...', 'info');

    html2canvas(cardElem, { 
      scale: 3, 
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#ffffff"
    }).then(canvas => {
      const link = document.createElement('a');
      const filename = `ID_CARD_${currentUserData ? currentUserData.name.replace(/\s+/g, '_') : 'KARYAWAN'}.png`;
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showStatus('ID Card berhasil diunduh!', 'success');
    }).catch(err => {
      console.error('Gagal mengunduh ID Card:', err);
      showStatus('Gagal mengunduh ID Card.', 'error');
    });
  }

  async function initAttendanceFlow() {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('attendanceSection').classList.remove('hidden');

    const companyName = currentUserData.pt || currentUserData.company || "PT. KHATULISTIWA SINAR ENERGI";
    document.getElementById('cardCompany').innerHTML = `<span>${companyName}</span>`;
    document.getElementById('cardName').textContent = currentUserData.name || "KARYAWAN";
    document.getElementById('cardPosition').textContent = currentUserData.position || "-";
    document.getElementById('cardPhone').textContent = currentUserData.phone || "-";
    document.getElementById('cardEmpId').textContent = currentUserData.empId || "-";

    const savedLastPhoto = localStorage.getItem(`last_avatar_${currentUserData.phone}`);
    if (savedLastPhoto) {
      document.getElementById('cardAvatar').src = savedLastPhoto;
    }

    generateEmployeeQRCode(currentUserData);

    const now = new Date();
    const currentHour = now.getHours();

    if (currentHour < START_HOUR || currentHour >= END_HOUR) {
      showStatus(`Absensi ditutup. Jam operasional 06.00 - 23.00 WIB.`, 'error');
      document.getElementById('scanBtn').disabled = true;
      return;
    }

    showStatus('Memeriksa status presensi hari ini...', 'info');
    const hasAttendedToday = await checkTodayAttendanceFromSupabase(currentUserData.phone);

    if (hasAttendedToday) {
      showStatus('Anda sudah melakukan absensi hari ini!', 'info');
      document.getElementById('scanBtn').disabled = true;
      return;
    }

    showStatus('Memeriksa posisi GPS Anda...', 'info');
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLon = position.coords.longitude;

          let isInRange = false;
          for (let loc of ALLOWED_LOCATIONS) {
            const distance = calculateDistance(currentLat, currentLon, loc.lat, loc.lon);
            if (distance <= MAX_RADIUS_METERS) {
              isInRange = true;
              matchedLocationName = loc.name;
              break;
            }
          }

          if (isInRange) {
            showStatus(`Lokasi Valid (${matchedLocationName}). Silakan scan wajah.`, 'success');
            startCamera('video');
          } else {
            showStatus('Gagal Absen: Lokasi Anda di luar radius kantor/workshop.', 'error');
            document.getElementById('scanBtn').disabled = true;
          }
        },
        (error) => {
          showStatus('Gagal membaca GPS. Aktifkan izin lokasi.', 'error');
          document.getElementById('scanBtn').disabled = true;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  }

  async function processAttendance() {
    const scanBtn = document.getElementById('scanBtn');
    scanBtn.disabled = true;
    showStatus('Memverifikasi rekam wajah & menyimpan data...', 'info');

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    const capturedDataUrl = canvas.toDataURL('image/png');

    document.getElementById('cardAvatar').src = capturedDataUrl;
    localStorage.setItem(`last_avatar_${currentUserData.phone}`, capturedDataUrl);

    stopCamera();

    const now = new Date();
    const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} WIB`;
    const isLate = (now.getHours() > LATE_HOUR || (now.getHours() === LATE_HOUR && now.getMinutes() > LATE_MINUTE));
    const statusText = isLate ? "TERLAMBAT" : "TEPAT WAKTU";
    const companyName = currentUserData.pt || currentUserData.company;

    try {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
      const fileName = `attend_${currentUserData.phone}_${Date.now()}.jpg`;

      const { error: storageError } = await supabaseClient
        .storage
        .from('attendance_photos')
        .upload(fileName, blob, { contentType: 'image/jpeg' });

      if (storageError) throw storageError;

      const { data: publicUrlData } = supabaseClient
        .storage
        .from('attendance_photos')
        .getPublicUrl(fileName);

      const { error: dbError } = await supabaseClient
        .from('attendances')
        .insert([{
          company_name: companyName,
          user_name: currentUserData.name,
          position: currentUserData.position,
          phone: currentUserData.phone,
          location_name: matchedLocationName,
          check_in_time: timeString,
          status: statusText,
          photo_url: publicUrlData.publicUrl
        }]);

      if (dbError) throw dbError;

      const todayDate = now.toISOString().split('T')[0];
      localStorage.setItem(`absent_date_${currentUserData.phone}`, todayDate);

      document.getElementById('attendanceSection').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('hidden');

      document.getElementById('capturedImage').src = capturedDataUrl;
      document.getElementById('resCompany').textContent = companyName;
      document.getElementById('resName').textContent = currentUserData.name;
      document.getElementById('resPosition').textContent = currentUserData.position;
      document.getElementById('resLocation').textContent = matchedLocationName;
      document.getElementById('resTime').textContent = timeString;

      const statusElem = document.getElementById('resStatus');
      statusElem.textContent = isLate ? "TERLAMBAT (Lewat 09:30)" : "TEPAT WAKTU";
      statusElem.className = isLate ? "val tag-late" : "val tag-ontime";

      showStatus('Absensi berhasil terverifikasi!', 'success');

    } catch (err) {
      console.error(err);
      showStatus(`Gagal menyimpan absensi: ${err.message}`, 'error');
      scanBtn.disabled = false;
    }
  }

  async function handleLeavePermission() {
    const reason = prompt("Masukkan alasan tidak masuk (Contoh: Sakit / Izin Acara Keluarga):");
    if (!reason) return;

    showStatus('Mengirim permohonan izin...', 'info');
    const now = new Date();
    const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} WIB`;
    const companyName = currentUserData.pt || currentUserData.company;

    try {
      const { error: dbError } = await supabaseClient
        .from('attendances')
        .insert([{
          company_name: companyName,
          user_name: currentUserData.name,
          position: currentUserData.position,
          phone: currentUserData.phone,
          location_name: "Luar Kantor",
          check_in_time: timeString,
          status: `IZIN: ${reason.toUpperCase()}`,
          photo_url: null
        }]);

      if (dbError) throw dbError;

      const todayDate = now.toISOString().split('T')[0];
      localStorage.setItem(`absent_date_${currentUserData.phone}`, todayDate);

      showStatus('Permohonan izin berhasil tercatat!', 'success');
      setTimeout(() => location.reload(), 2000);

    } catch (err) {
      console.error(err);
      showStatus(`Gagal mengirim izin: ${err.message}`, 'error');
    }
  }

  async function startCamera(videoId) {
    try {
      stopCamera();
      const constraints = { video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false };
      activeStream = await navigator.mediaDevices.getUserMedia(constraints);
      const videoElem = document.getElementById(videoId);
      videoElem.srcObject = activeStream;
      await videoElem.play();
    } catch (err) {
      console.error(err);
      showStatus('Gagal membuka kamera perangkat.', 'error');
    }
  }

  function stopCamera() {
    if (activeStream) {
      activeStream.getTracks().forEach(track => track.stop());
      activeStream = null;
    }
  }

  function logout() {
    stopCamera();
    localStorage.removeItem('corporate_user_session');
    location.reload();
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function showStatus(message, type) {
    const statusDiv = document.getElementById('statusMessage');
    statusDiv.style.display = 'block';
    statusDiv.className = `status-badge ${type}`;
    statusDiv.textContent = message;
  }
</script>
